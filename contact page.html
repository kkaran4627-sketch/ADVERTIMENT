<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — AdVibe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;background:#0b0f1a;color:#fff;line-height:1.6}
.wrap{width:min(1100px,92%);margin:auto}
header{position:sticky;top:0;background:#0b0f1acc;backdrop-filter:blur(10px);border-bottom:1px solid #232c44;z-index:10}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font-weight:800;font-size:22px;color:#7c5cff;text-decoration:none}
nav{display:flex;gap:22px;align-items:center}
nav a{color:#a9b1c9;text-decoration:none;font-size:15px}
.page{padding:90px 0}
.tag{display:inline-block;padding:7px 14px;border:1px solid #7c5cff;border-radius:999px;color:#c9b8ff;font-size:13px;margin-bottom:18px}
h1{font-size:clamp(36px,6vw,62px);line-height:1.08;margin-bottom:18px}
.lead{color:#a9b1c9;font-size:18px;max-width:620px;margin-bottom:35px}
form{max-width:620px;margin:auto;background:#131a2c;border:1px solid #232c44;border-radius:20px;padding:30px;display:grid;gap:14px}
input,textarea,select{width:100%;padding:14px;border-radius:10px;border:1px solid #2b3550;background:#0b0f1a;color:#fff}
button{padding:15px;border:0;border-radius:999px;background:linear-gradient(90deg,#7c5cff,#00d4ff);color:#08111f;font-weight:800;cursor:pointer}
footer{padding:30px 0;border-top:1px solid #232c44;color:#8b93ac;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">AdVibe</a>
    <nav>
      <a href="index.html">What We Do</a>
      <a href="meta-ads.html">Meta Ads</a>
      <a href="google-ads.html">Google Ads</a>
      <a href="creative-design.html">Creative Design</a>
    </nav>
  </div>
</header>

<main class="wrap page">
  <span class="tag">Contact</span>
  <h1>Let’s grow your business.</h1>
  <p class="lead">Fill the form and our team will contact you within 24 hours.</p>

  <form onsubmit="event.preventDefault();alert('Thank you! We will contact you soon.');this.reset();">
    <input placeholder="Your name" required>
    <input type="email" placeholder="Email address" required>
    <input placeholder="WhatsApp number" required>
    <select required>
      <option value="">Select service</option>
      <option>Meta Ads</option>
      <option>Google Ads</option>
      <option>Creative Design</option>
      <option>Landing Page</option>
    </select>
    <textarea rows="4" placeholder="Tell us about your business"></textarea>
    <button type="submit">Request Free Strategy Call</button>
  </form>
</main>

<footer><div class="wrap">© 2026 AdVibe. All rights reserved.</div></footer>

</body>
</html>
